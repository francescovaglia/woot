name: Woot
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WootKit:
    path: Packages/WootKit
targets:
  Woot:
    type: application
    platform: iOS
    sources:
      # The .icon is a folder package: without the exclude, XcodeGen walks into it
      # and adds its files one by one instead of the icon itself.
      - path: Woot
        excludes:
          - "Resources/AppIcon.icon"
      - path: Woot/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: WootKit
        product: ChatwootModels
      - package: WootKit
        product: ChatwootAPI
      - package: WootKit
        product: ChatwootRealtime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOOT_BUNDLE_ID)
        PRODUCT_NAME: Woot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Woot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  WootUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WootUITests]
    dependencies:
      - target: Woot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOOT_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Woot
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Woot:
    build:
      targets:
        Woot: all
    test:
      targets:
        - WootUITests
