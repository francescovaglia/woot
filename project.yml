name: Woot
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WootKit:
    path: Packages/WootKit
targets:
  Woot:
    type: application
    platform: iOS
    sources:
      # The .icon is a folder package: without the exclude, XcodeGen walks into it
      # and adds its files one by one instead of the icon itself.
      - path: Woot
        excludes:
          - "Resources/AppIcon.icon"
      - path: Woot/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - Shared
    info:
      path: Woot/Info.plist
      properties:
        WootKeychainGroup: $(AppIdentifierPrefix)$(WOOT_BUNDLE_ID).shared
        WootPushRelay: $(WOOT_PUSH_RELAY)
        WootAPSEnvironment: $(WOOT_APS_ENVIRONMENT)
    entitlements:
      path: Woot/Woot.entitlements
      properties:
        aps-environment: $(WOOT_APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(WOOT_BUNDLE_ID).shared
    dependencies:
      - package: WootKit
        product: ChatwootModels
      - package: WootKit
        product: ChatwootAPI
      - package: WootKit
        product: ChatwootRealtime
      - package: WootKit
        product: ChatwootPush
      - target: WootNotifications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOOT_BUNDLE_ID)
        PRODUCT_NAME: Woot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Woot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  WootNotifications:
    type: app-extension
    platform: iOS
    sources: [WootNotifications, Shared]
    info:
      path: WootNotifications/Info.plist
      properties:
        CFBundleDisplayName: Woot Notifications
        WootKeychainGroup: $(AppIdentifierPrefix)$(WOOT_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: WootNotifications/WootNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(WOOT_BUNDLE_ID).shared
    dependencies:
      - package: WootKit
        product: ChatwootModels
      - package: WootKit
        product: ChatwootAPI
      - package: WootKit
        product: ChatwootPush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOOT_BUNDLE_ID).notifications
        GENERATE_INFOPLIST_FILE: YES
        # The system calls the extension off the main thread.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  WootUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WootUITests]
    dependencies:
      - target: Woot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOOT_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Woot
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Woot:
    build:
      targets:
        Woot: all
    test:
      targets:
        - WootUITests
